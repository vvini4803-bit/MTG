<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="grad-saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#grad-bg)" stroke="url(#grad-gold)" stroke-width="2" />
  
  <!-- Digital Circuit Ring / Sun -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(253, 224, 71, 0.25)" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="50" cy="50" r="24" fill="url(#grad-saffron)" opacity="0.85" filter="url(#glow)" />
  
  <!-- Temple Kalasha / Spires Motif in Silhouette -->
  <path d="M50 22 L55 35 L52 35 L56 46 L44 46 L48 35 L45 35 Z" fill="url(#grad-gold)" />
  
  <!-- Wheat / Agricultural Sprout Silhouette -->
  <path d="M50 78 C50 64 36 60 33 52 C33 62 42 72 50 78 Z" fill="#4ADE80" opacity="0.9" />
  <path d="M50 78 C50 64 64 60 67 52 C67 62 58 72 50 78 Z" fill="#86EFAC" opacity="0.9" />
  <path d="M50 78 L50 48" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Tech Nodes -->
  <circle cx="33" cy="52" r="3" fill="#FDE047" />
  <circle cx="67" cy="52" r="3" fill="#FDE047" />
  <circle cx="50" cy="22" r="2.5" fill="#FFFFFF" />
</svg>
